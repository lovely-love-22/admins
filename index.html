<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Правила сервера — RMRP</title>
<style>
  /* --- ЦВЕТОВАЯ ПАЛИТРА И ПЕРЕМЕННЫЕ --- */
  :root {
    --bg: #050508;
    --bg-gradient: radial-gradient(circle at 50% 0%, #171124 0%, #050508 70%);
    --card: rgba(24, 24, 27, 0.6);
    --card-hover: rgba(39, 39, 42, 0.9);
    --border: rgba(168, 85, 247, 0.15);
    --border-hover: rgba(168, 85, 247, 0.6);
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #c084fc;
    --accent-glow: rgba(192, 132, 252, 0.4);
    --danger: #f87171;
    --danger-bg: rgba(248, 113, 113, 0.1);
    --danger-border: rgba(248, 113, 113, 0.3);
    --radius: 16px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* --- КОНТЕЙНЕР --- */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 50px 24px;
    animation: fadeIn 0.4s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- КНОПКА НАЗАД --- */
  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 40px;
  }
  .btn-back:hover {
    background: var(--card-hover);
    border-color: var(--border-hover);
    box-shadow: 0 0 15px var(--accent-glow);
    transform: translateX(-3px);
  }

  /* --- ЗАГОЛОВОК --- */
  .page-title {
    font-size: 32px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 40px;
    background: linear-gradient(90deg, #fff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px var(--accent-glow);
  }
  .page-title span {
    -webkit-text-fill-color: initial;
    font-size: 36px;
  }

  /* --- СЕТКА ПЛИТОК (ГЛАВНАЯ) --- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }
  .tile {
    background: var(--card);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }
  .tile::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: 0.3s;
  }
  .tile:hover {
    background: var(--card-hover);
    border-color: var(--border-hover);
    transform: translateY(-5px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px var(--accent-glow);
  }
  .tile:hover::before { opacity: 1; }
  
  .tile-icon {
    font-size: 40px;
    margin-bottom: 4px;
    filter: drop-shadow(0 0 10px var(--accent-glow));
  }
  .tile-title {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
  }
  .tile-desc {
    font-size: 14px;
    color: var(--text-muted);
    flex-grow: 1;
  }
  .tile-tag {
    align-self: flex-start;
    background: rgba(168, 85, 247, 0.1);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* --- ПОИСК --- */
  .search-box {
    margin-bottom: 40px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 18px 24px;
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 16px;
    outline: none;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow), 0 4px 20px rgba(0,0,0,0.4);
    background: var(--card-hover);
  }
  .search-box input::placeholder {
    color: #64748b;
  }

  /* --- ПРАВИЛА (СТРАНИЦА ГЛАВЫ) --- */
  .chapter-header {
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 50px;
    text-shadow: 0 0 15px var(--accent-glow);
  }
  .chapter-header:first-of-type { margin-top: 0; }
  
  .rule-card {
    background: var(--card);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    transition: all 0.2s ease;
    position: relative;
  }
  .rule-card:hover {
    border-color: rgba(168, 85, 247, 0.4);
    background: var(--card-hover);
    box-shadow: 0 5px 20px rgba(0,0,0,0.3);
  }
  .rule-title {
    color: var(--accent);
    font-weight: 800;
    font-size: 18px;
    margin-bottom: 12px;
    display: flex;
    gap: 8px;
  }
  .rule-text {
    font-size: 16px;
    color: #e2e8f0;
    margin-bottom: 16px;
    line-height: 1.6;
  }
  .rule-note {
    font-size: 15px;
    color: var(--text-muted);
    border-left: 3px solid var(--accent);
    background: rgba(168, 85, 247, 0.05);
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 16px;
    font-style: italic;
  }
  .rule-punish {
    display: inline-block;
    background: var(--danger-bg);
    color: #fca5a5;
    border: 1px solid var(--danger-border);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 0 10px rgba(248, 113, 113, 0.1);
  }
  .rule-punish span {
    color: var(--danger);
  }

  /* --- УТИЛИТЫ --- */
  @media (max-width: 600px) {
    .page-title { font-size: 24px; }
    .tile { padding: 20px; }
    .container { padding: 30px 16px; }
  }
</style>
</head>

/* =========================================

   ========================================= */
const app = document.getElementById('app');

// Главная страница (Плитки)
function renderHome(pushState = true) {
  if (pushState) {
    history.pushState({ view: 'home' }, '', window.location.pathname);
  }

  let html = `
    <div class="page-title">
      <span>📖</span> Правила сервера
    </div>
    <div class="grid">
  `;

  DATABASE.forEach(category => {
    html += `
      <div class="tile" onclick="openCategory('${category.id}')">
        <div class="tile-icon">${category.icon}</div>
        <div class="tile-title">${category.title}</div>
        <div class="tile-desc">${category.desc}</div>
        <div class="tile-tag">${category.tag}</div>
      </div>
    `;
  });

  html += `</div>`;
  app.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Страница с правилами (Глава)
function openCategory(categoryId, pushState = true) {
  const category = DATABASE.find(c => c.id === categoryId);
  if (!category) return;

  if (pushState) {
    history.pushState({ view: 'category', id: categoryId }, '', `#${categoryId}`);
  }

  let html = `
    <button class="btn-back" onclick="history.back()">← На главную</button>
    <div class="page-title">
      <span>${category.icon}</span> ${category.title}
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск по правилам (например: 1.1, запрещено)..." oninput="filterRules()">
    </div>
    <div id="rulesContainer">
  `;

  category.chapters.forEach(chapter => {
    html += `
      <div class="chapter-block">
        <div class="chapter-header">${chapter.title}</div>
    `;
    
    chapter.rules.sort((a, b) => (parseFloat(a.num) || 0) - (parseFloat(b.num) || 0));

    chapter.rules.forEach(rule => {
      html += `
        <div class="rule-card" data-search="${rule.num} ${rule.title} ${rule.text}">
          <div class="rule-title">${rule.num}. ${rule.title}</div>
          <div class="rule-text">${rule.text}</div>
          ${rule.note ? `<div class="rule-note">${rule.note}</div>` : ''}
          ${rule.punish ? `<div class="rule-punish">Наказание: <span>${rule.punish}</span></div>` : ''}
        </div>
      `;
    });
    html += `</div>`;
  });

  html += `</div>`;
  app.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Поиск внутри категории
function filterRules() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const chapters = document.querySelectorAll('.chapter-block');
  
  chapters.forEach(ch => {
    let hasVisible = false;
    const cards = ch.querySelectorAll('.rule-card');
    
    cards.forEach(card => {
      const text = card.getAttribute('data-search').toLowerCase();
      if (text.includes(query)) {
        card.style.display = 'block';
        hasVisible = true;
      } else {
        card.style.display = 'none';
      }
    });

    ch.style.display = hasVisible ? 'block' : 'none';
  });
}

// Обработка кнопок "Назад" / "Вперед" в браузере и на мышке
window.addEventListener('popstate', (event) => {
  if (event.state && event.state.view === 'category') {
    openCategory(event.state.id, false);
  } else {
    renderHome(false);
  }
});

// Инициализация при загрузке (проверяем хеш в URL)
window.addEventListener('DOMContentLoaded', () => {
  const hash = window.location.hash.replace('#', '');
  if (hash && DATABASE.some(c => c.id === hash)) {
    // Если в ссылке есть ID категории, открываем её
    history.replaceState({ view: 'category', id: hash }, '', `#${hash}`);
    openCategory(hash, false);
  } else {
    // Иначе показываем главную
    history.replaceState({ view: 'home' }, '', window.location.pathname);
    renderHome(false);
  }
});
</script>
