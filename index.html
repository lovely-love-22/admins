<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Правила сервера — RMRP</title>
<style>
  :root{
    --bg:#0d1117;
    --bg-soft:#161b22;
    --card:#1b2230;
    --card-2:#222b3a;
    --line:#2b3444;
    --text:#e6edf3;
    --muted:#9aa7b8;
    --accent:#4f8cff;
    --accent-2:#7ee787;
    --warn:#f2cc60;
    --danger:#ff7b72;
    --radius:14px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #1b2b4a 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, #1d3a2e 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    line-height:1.6;
    min-height:100vh;
  }
  a{color:var(--accent); text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- Header ---------- */
  header.top{
    position:sticky; top:0; z-index:50;
    backdrop-filter: blur(12px);
    background:rgba(13,17,23,.82);
    border-bottom:1px solid var(--line);
  }
  .top-inner{
    max-width:1200px; margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  .logo{
    display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.5px;
    font-size:20px;
  }
  .logo .badge{
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(135deg,var(--accent),#7ee787);
    display:grid; place-items:center; color:#07101f; font-weight:900;
  }
  .search{
    flex:1; min-width:260px; position:relative;
  }
  .search input{
    width:100%; padding:12px 44px 12px 16px;
    border-radius:12px; border:1px solid var(--line);
    background:var(--bg-soft); color:var(--text);
    font-size:15px; outline:none; transition:.2s;
  }
  .search input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(79,140,255,.15);
  }
  .search .hint{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    font-size:12px; color:var(--muted); border:1px solid var(--line);
    padding:2px 8px; border-radius:6px; background:var(--bg);
  }

  /* ---------- Layout ---------- */
  .wrap{max-width:1200px; margin:0 auto; padding:26px 20px 80px}
  .hero{
    text-align:center; padding:26px 10px 10px;
  }
  .hero h1{
    font-size:clamp(24px,4vw,40px); margin:0 0 8px;
    background:linear-gradient(90deg,#fff,#9ec1ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{color:var(--muted); margin:0}
  .stats{
    display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:20px 0 6px;
  }
  .stat{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 18px; font-size:13px; color:var(--muted);
  }
  .stat b{color:var(--text); font-size:16px; display:block}

  /* ---------- TOC ---------- */
  .toc{
    display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 8px;
  }
  .toc button{
    cursor:pointer; padding:8px 14px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    font-size:13px; transition:.2s;
  }
  .toc button:hover{color:var(--text); border-color:var(--accent)}
  .toc button.active{background:var(--accent); color:#06101f; border-color:var(--accent); font-weight:700}

  /* ---------- Cards ---------- */
  .card{
    background:linear-gradient(180deg,var(--card),var(--card-2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:22px 22px 8px;
    margin:18px 0;
    scroll-margin-top:90px;
  }
  .card h2{
    margin:0 0 14px; font-size:20px;
    display:flex; align-items:center; gap:10px;
  }
  .card h2 .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent); box-shadow:0 0 12px var(--accent);
  }
  .rule{
    padding:12px 14px;
    border-radius:10px;
    border:1px solid transparent;
    margin:8px 0;
    transition:.2s;
  }
  .rule:hover{background:rgba(255,255,255,.03); border-color:var(--line)}
  .rule .num{
    display:inline-block; min-width:52px;
    font-weight:800; color:var(--accent-2);
    margin-right:8px;
  }
  .rule mark{
    background:rgba(242,204,96,.35);
    color:#fff; padding:0 3px; border-radius:4px;
  }
  .punish{
    color:var(--warn); font-weight:600;
  }
  .punish.danger{color:var(--danger)}
  .note{
    color:var(--muted); font-size:14px; display:block; margin-top:4px;
  }
  .no-results{
    text-align:center; color:var(--muted); padding:40px 10px; display:none;
  }
  .no-results.show{display:block}

  /* ---------- Footer ---------- */
  footer{
    text-align:center; color:var(--muted); font-size:13px;
    padding:30px 20px; border-top:1px solid var(--line); margin-top:40px;
  }

  /* ---------- Back to top ---------- */
  #toTop{
    position:fixed; right:22px; bottom:22px; z-index:60;
    width:48px; height:48px; border-radius:50%;
    border:1px solid var(--line); background:var(--card); color:var(--text);
    cursor:pointer; font-size:20px; display:none;
    box-shadow:var(--shadow);
  }
  #toTop.show{display:block}

  @media (max-width:640px){
    .rule .num{display:block; margin-bottom:2px}
    .card{padding:18px 16px 6px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="logo"><span class="badge">R</span> RMRP · Правила</div>
    <div class="search">
      <input id="q" type="search" placeholder="Поиск: 1.20 ПГО, допрос, рейд, ограбление…" autocomplete="off"/>
      <span class="hint">Ctrl+K</span>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Правила сервера</h1>
    <p>Полный свод правил. Мгновенный поиск по пунктам и ключевым словам.</p>
    <div class="stats">
      <div class="stat"><b id="statChapters">0</b>глав</div>
      <div class="stat"><b id="statRules">0</b>пунктов</div>
      <div class="stat"><b id="statFound">0</b>найдено</div>
    </div>
  </section>

  <nav class="toc" id="toc"></nav>

  <div id="content"></div>

  <div class="no-results" id="noResults">
    🔍 Ничего не найдено. Попробуйте другой запрос (например, «рейд», «1.8», «PG»).
  </div>
</main>

<footer>
  RMRP · Правила сервера · Незнание правил не освобождает от ответственности
</footer>

<button id="toTop" title="Наверх">↑</button>

/* =========================================================
   РЕНДЕР
   ========================================================= */
const content = document.getElementById('content');
const toc = document.getElementById('toc');
const qInput = document.getElementById('q');
const noResults = document.getElementById('noResults');

let totalRules = 0;
DATA.forEach(ch => totalRules += ch.rules.length);
document.getElementById('statChapters').textContent = DATA.length;
document.getElementById('statRules').textContent = totalRules;

/* TOC */
DATA.forEach(ch => {
  const btn = document.createElement('button');
  btn.textContent = ch.title;
  btn.dataset.target = ch.id;
  btn.addEventListener('click', () => {
    document.getElementById(ch.id)?.scrollIntoView({behavior:'smooth', block:'start'});
    document.querySelectorAll('.toc button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
  toc.appendChild(btn);
});

/* Cards */
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function highlight(text, term){
  if(!term) return escapeHtml(text);
  const safe = escapeHtml(text);
  const re = new RegExp('(' + term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
  return safe.replace(re, '<mark>$1</mark>');
}

DATA.forEach(ch => {
  const card = document.createElement('section');
  card.className = 'card';
  card.id = ch.id;
  const h2 = document.createElement('h2');
  h2.innerHTML = '<span class="dot"></span>' + escapeHtml(ch.title);
  card.appendChild(h2);

  ch.rules.forEach(r => {
    const div = document.createElement('div');
    div.className = 'rule';
    div.dataset.num = r.num;
    div.dataset.text = r.text;
    div.dataset.chapter = ch.title;
    let html = `<span class="num">${escapeHtml(r.num)}</span><span class="txt">${escapeHtml(r.text)}</span>`;
    if (r.punish) html += ` <span class="punish">[${escapeHtml(r.punish)}]</span>`;
    if (r.note) html += `<span class="note">${escapeHtml(r.note)}</span>`;
    div.innerHTML = html;
    card.appendChild(div);
  });

  content.appendChild(card);
});

/* =========================================================
   ПОИСК
   ========================================================= */
function normalize(s){
  return s.toLowerCase().replace(/ё/g,'е').replace(/[«»"'`]/g,'').trim();
}

/* Разбираем запрос: "1.20 ПГО", "1.20", "рейд 1.8", "PG" */
function parseQuery(q){
  const raw = normalize(q);
  const numMatch = raw.match(/\b(\d+(?:\.\d+)*)\b/);
  const number = numMatch ? numMatch[1] : null;
  const rest = number ? raw.replace(number, ' ').replace(/\s+/g,' ').trim() : raw;
  return { raw, number, rest };
}

function matches(rule, chapter, parsed){
  const num = normalize(rule.num);
  const text = normalize(rule.text + ' ' + (rule.punish||'') + ' ' + (rule.note||''));
  const ch = normalize(chapter.title);

  // если в запросе есть номер
  if (parsed.number){
    // точное совпадение по номеру (начинается с введённого номера)
    const numOk = num === parsed.number || num.startsWith(parsed.number + '.');
    if (!numOk) return false;
    // если после номера есть ещё текст (например "1.20 ПГО") — проверяем его как ключевые слова
    if (!parsed.rest) return true;
    const words = parsed.rest.split(/\s+/).filter(Boolean);
    return words.every(w => text.includes(w) || ch.includes(w) || num.includes(w));
  }

  // нет номера — ищем по всем словам в тексте/названии главы/номере
  const words = parsed.raw.split(/\s+/).filter(Boolean);
  if (!words.length) return true;
  return words.every(w => text.includes(w) || ch.includes(w) || num.includes(w));
}

function renderSearch(q){
  const parsed = parseQuery(q);
  const cards = document.querySelectorAll('.card');
  let found = 0;

  cards.forEach(card => {
    let visibleInCard = 0;
    const rules = card.querySelectorAll('.rule');
    rules.forEach(rule => {
      const chapter = { title: card.querySelector('h2').textContent };
      const ruleData = { num: rule.dataset.num, text: rule.dataset.text };
      // подтянем punish/note из DOM для полноты поиска
      ruleData.text = rule.textContent;
      const ok = !q || matches(ruleData, chapter, parsed);
      rule.style.display = ok ? '' : 'none';
      if (ok) visibleInCard++;

      // подсветка
      const txtSpan = rule.querySelector('.txt');
      if (txtSpan){
        const original = rule.dataset.text;
        txtSpan.innerHTML = q && !parsed.number
          ? highlight(original, parsed.raw)
          : escapeHtml(original);
      }
    });

    card.style.display = visibleInCard ? '' : 'none';
    if (visibleInCard) found += visibleInCard;
  });

  document.getElementById('statFound').textContent = found;
  noResults.classList.toggle('show', found === 0);
}

/* debounce */
let t;
qInput.addEventListener('input', e => {
  clearTimeout(t);
  t = setTimeout(() => renderSearch(e.target.value), 120);
});

/* Ctrl+K */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    qInput.focus();
    qInput.select();
  }
});

/* Back to top */
const toTop = document.getElementById('toTop');
window.addEventListener('scroll', () => {
  toTop.classList.toggle('show', window.scrollY > 600);
});
toTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
